[package]
name = "chatcore"
version = "0.1.0"
edition.workspace = true
publish.workspace = true

[dependencies]
openmls = "=0.8.1"
openmls_rust_crypto = "=0.5.1"
openmls_basic_credential = "=0.5.0"
openmls_traits = "=0.5.0"
tls_codec = { version = "0.4", features = ["derive"] }
prost = "0.13"

[build-dependencies]
prost-build = "0.13"
protoc-bin-vendored = "3"
