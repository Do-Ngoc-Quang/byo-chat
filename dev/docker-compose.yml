# Hạ tầng cục bộ cho giai đoạn 2. Chạy: docker compose -f dev/docker-compose.yml up -d
# LiveKit thêm ở giai đoạn 6.
services:
  postgres:
    image: postgres:16
    environment: { POSTGRES_USER: chat, POSTGRES_PASSWORD: chat, POSTGRES_DB: chat }
    ports: ["5432:5432"]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U chat"], interval: 3s, retries: 20 }
  dynamodb:
    image: amazon/dynamodb-local:2.5.2
    command: ["-jar", "DynamoDBLocal.jar", "-inMemory", "-port", "8000"]
    ports: ["8000:8000"]
  nats:
    image: nats:2.10
    command: ["-js", "-sd", "/data"]
    ports: ["4222:4222"]
    volumes: ["nats-data:/data"]
  valkey:
    image: valkey/valkey:8
    ports: ["6379:6379"]   # presence, rate limit, cache thành viên: chưa dùng ở giai đoạn 2
volumes:
  nats-data: {}
