version: v2
# Mã sinh không commit (gen/ trong .gitignore). Rust sinh bằng chatcore/build.rs.
managed:
  enabled: true
  override:
    - file_option: go_package_prefix
      value: byo-chat/server/gen
plugins:
  - local: protoc-gen-go
    out: ../server/gen
    opt: paths=source_relative
  - local: protoc-gen-connect-go
    out: ../server/gen
    opt: paths=source_relative
  - remote: buf.build/protocolbuffers/dart:v22.0.1
    out: ../app/gen
